site_name: Boise Idaho YSA Stake — Gathering Plan Guide
site_description: Councils, committees, role charters, and the Married Couples Orientation Guide
docs_dir: docs

theme:
  name: material
  custom_dir: overrides
  font:
    text: Noto Sans
    code: Roboto Mono
  palette:
    - scheme: default
      primary: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    - toc.integrate
    - search.suggest
    - content.code.copy

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - attr_list
  - admonition
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences

nav:
  - Home: README.md
  - Overview: overview.md
  - Gathering Plan:
      - Overall Plan: gathering-plan/index.md
      - Stake Activities: gathering-plan/part-2-activities.md
      - Athletics: gathering-plan/part-3-athletics.md
      - Learning and Enrichment: gathering-plan/part-4-enrichment.md
      - Month-by-Month Calendar: gathering-plan/part-5-calendar.md
  - Stake YSA Council:
      - Overview: stake-ysa-council/index.md
      - Roles: stake-ysa-council/roles.md
      - Detailed Charter: stake-ysa-council/detailed-charter.md
  - Stake Activities Committee:
      - Overview: stake-activities-committee/index.md
      - Roles: stake-activities-committee/roles.md
      - Detailed Charter: stake-activities-committee/detailed-charter.md
  - Stake Athletics Committee:
      - Overview: stake-athletics-committee/index.md
      - Roles: stake-athletics-committee/roles.md
      - Detailed Charter: stake-athletics-committee/detailed-charter.md
  - Stake Education & Enrichment Committee:
      - Overview: stake-education-enrichment-committee/index.md
      - Roles: stake-education-enrichment-committee/roles.md
      - Detailed Charter: stake-education-enrichment-committee/detailed-charter.md
  - Married Adults Committee: 06-married-adults-committee.md
  - Additional Stake-Level Roles: 07-additional-roles.md
